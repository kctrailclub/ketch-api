name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    # Required status check for merges to main (Operating Model v2 Phase 1, DEC-0020).
    name: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt ruff
      - name: Ruff (syntax errors and undefined names only)
        # Full ruff ruleset reports ~339 findings at 2026-10-26; widening the selection is a TD item, not a CI gate.
        run: ruff check --select E9,F63,F7,F82 app tests
      - name: Pytest
        run: python -m pytest -q

  api-security:
    # Informational: not a required check. Findings feed the Security Engineer's Monday sweep (DEC-0020 D5).
    name: api-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (known CVEs in pinned dependencies)
        run: pip-audit -r requirements.txt --progress-spinner off

  secrets-scan:
    # Informational: full-history secret scan. Complements GitHub secret scanning + push protection.
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source /repo --redact --no-banner --exit-code 1
